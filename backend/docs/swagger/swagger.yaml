info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 软件授权管理系统API文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: License Manager API
  version: "1.0"
paths:
  /api/customers:
    get:
      consumes:
      - application/json
      description: 分页查询客户列表，支持搜索和筛选
      parameters:
      - description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认20，最大100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 搜索关键词(支持客户编码、名称、联系人、邮箱)
        in: query
        name: search
        type: string
      - description: 客户类型筛选
        enum:
        - individual
        - enterprise
        - government
        - education
        in: query
        name: customer_type
        type: string
      - description: 客户等级筛选
        enum:
        - normal
        - vip
        - enterprise
        - strategic
        in: query
        name: customer_level
        type: string
      - description: 状态筛选
        enum:
        - active
        - disabled
        in: query
        name: status
        type: string
      - description: 排序字段，默认created_at
        enum:
        - created_at
        - updated_at
        - customer_name
        - customer_code
        in: query
        name: sort
        type: string
      - description: 排序方向，默认desc
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.CustomerListResponse'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询客户列表
      tags:
      - 客户管理
    post:
      consumes:
      - application/json
      description: 创建新的客户记录，自动生成客户编码
      parameters:
      - description: 客户信息
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/license-manager_internal_models.CustomerCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.Customer'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "409":
          description: 客户已存在
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建客户
      tags:
      - 客户管理
  /api/customers/{id}:
    delete:
      consumes:
      - application/json
      description: 直接删除客户记录，删除前会检查是否有关联的授权码或许可证，如有则提示先删除授权
      parameters:
      - description: 客户ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/license-manager_internal_models.APIResponse'
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "404":
          description: 客户不存在
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "409":
          description: 客户仍有授权，无法删除
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除客户
      tags:
      - 客户管理
    get:
      consumes:
      - application/json
      description: 根据客户ID获取客户详细信息
      parameters:
      - description: 客户ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.Customer'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "404":
          description: 客户不存在
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取客户详情
      tags:
      - 客户管理
    put:
      consumes:
      - application/json
      description: 更新客户信息，所有字段都是可选的
      parameters:
      - description: 客户ID
        in: path
        name: id
        required: true
        type: string
      - description: 客户信息
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/license-manager_internal_models.CustomerUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.Customer'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "404":
          description: 客户不存在
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新客户信息
      tags:
      - 客户管理
  /api/customers/{id}/status:
    patch:
      consumes:
      - application/json
      description: 修改客户状态（激活/停用）
      parameters:
      - description: 客户ID
        in: path
        name: id
        required: true
        type: string
      - description: 状态信息
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/license-manager_internal_models.CustomerStatusUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 状态更新成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.Customer'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "404":
          description: 客户不存在
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改客户状态
      tags:
      - 客户管理
  /api/enums:
    get:
      consumes:
      - application/json
      description: 获取系统中所有枚举类型及其对应的多语言显示值
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.EnumListResponse'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取所有枚举值
      tags:
      - 枚举管理
  /api/enums/{type}:
    get:
      consumes:
      - application/json
      description: 根据枚举类型获取对应的多语言显示值
      parameters:
      - description: 枚举类型
        enum:
        - customer_type
        - customer_level
        - customer_status
        - company_size
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.EnumTypeResponse'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取指定类型的枚举值
      tags:
      - 枚举管理
  /api/leads:
    get:
      consumes:
      - application/json
      description: 管理员获取线索列表，支持分页和筛选
      parameters:
      - description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认10，最大100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 关键词检索
        in: query
        name: search
        type: string
      - description: 状态筛选
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.LeadListResponse'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取线索列表
      tags:
      - 企业线索
    post:
      consumes:
      - application/json
      description: 用户提交企业线索，无需鉴权
      parameters:
      - description: 线索创建请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/license-manager_internal_models.LeadCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.LeadResponse'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      summary: 创建线索
      tags:
      - 企业线索
