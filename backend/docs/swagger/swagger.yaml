  /api/v1/licenses:
    get:
      consumes:
      - application/json
      description: 分页查询许可证列表，支持筛选
      parameters:
      - description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认20，最大100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 授权码ID筛选
        in: query
        name: authorization_code_id
        type: string
      - description: 客户ID筛选
        in: query
        name: customer_id
        type: string
      - description: 状态筛选
        enum:
        - active
        - inactive
        - revoked
        in: query
        name: status
        type: string
      - description: 在线状态筛选
        in: query
        name: is_online
        type: boolean
      - description: 排序字段，默认created_at
        enum:
        - created_at
        - updated_at
        - activated_at
        - last_heartbeat
        in: query
        name: sort
        type: string
      - description: 排序方向，默认desc
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/license-manager_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/license-manager_internal_models.LicenseListResponse'
              type: object
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/license-manager_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询许可证列表
      tags:
      - 许可证管理
